<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt meg</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a href="#innhold" class="hopp-lenke">Hopp til innhold</a>
    <header>
      <a
        href="index.html"
        class="logo"
        aria-label="BG – Benjamin Eidem Gregersen, til forsiden"
        >BG</a
      >
      <nav aria-label="Hovedmeny">
        <ul>
          <li><a href="index.html">Forside</a></li>
          <li><a href="om-meg.html">Om meg</a></li>
          <li><a href="prosjekter.html">Prosjekter</a></li>
          <li><a href="kontakt.html" aria-current="page">Kontakt</a></li>
        </ul>
      </nav>
    </header>

    <main id="innhold" class="kontakt">
      <h1>Kontakt</h1>
      <p>Send meg en melding, så svarer jeg så fort jeg kan.</p>

      <form name="kontakt" method="POST" action="takk.html" data-netlify="true">
        <input type="hidden" name="form-name" value="kontakt" />

        <div class="felt">
          <label for="navn">Navn</label>
          <input
            type="text"
            id="navn"
            name="navn"
            autocomplete="name"
            required
          />
        </div>

        <div class="felt">
          <label for="epost">E-post</label>
          <input
            type="email"
            id="epost"
            name="epost"
            autocomplete="email"
            required
          />
        </div>

        <div class="felt">
          <label for="melding">Melding</label>
          <textarea id="melding" name="melding" rows="6" required></textarea>
        </div>

        <p class="skjema-info">
          Opplysningene brukes bare til å svare deg. Les mer i
          <a href="personvern.html">personvernerklæringen</a>.
        </p>
        <div class="knapp-rad">
          <button type="submit" class="knapp">Send melding</button>
        </div>
      </form>
    </main>

    <footer>
      <p class="footer-navn">Benjamin Eidem Gregersen</p>
      <p>Kristiansand 2026</p>
      <p><a href="personvern.html">Personvernerklæring</a></p>
    </footer>
  </body>
</html>
